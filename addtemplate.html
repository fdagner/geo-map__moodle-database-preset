   <script>
   // Koordinaten-Feld gegen manuelle Eingabe sperren (pointer-events:none blockt nicht die Tastatur/Tab)
   // und vor dem Speichern pruefen, ob eine echte Koordinate drin steht (Pflichtfeld-Pruefung von
   // Moodle akzeptiert auch ein einzelnes Leerzeichen!)
   var koordInput = document.querySelector("[title='Koordinate'] input.basefieldinput");
   if (koordInput) {
       koordInput.readOnly = true;

       document.querySelector('form').addEventListener('submit', function(e) {
           var wert = koordInput.value.trim();
           var gueltig = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(wert);
           if (!gueltig) {
               e.preventDefault();
               alert('Bitte zuerst auf die Karte klicken, um die Koordinate festzulegen!');
           }
       });
   }
   </script>
   <script>
   // Farb-Buttons statt Dropdown fuer das Menue-Feld "CSS-Farbe".
   // Die Buttons werden automatisch aus den Optionen des Felds erzeugt:
   // Farben aendern/ergaenzen geht daher in Moodle unter
   // Datenbank -> Felder verwalten -> CSS-Farbe -> Optionen (eine Farbe pro Zeile).
   (function() {
       var select = document.getElementById('[[CSS-Farbe#id]]');
       if (!select || select.tagName !== 'SELECT') return;

       var container = document.createElement('div');
       container.className = 'farbwahl';

       Array.from(select.options).forEach(function(opt) {
           var farbe = opt.value;
           if (!farbe) return; // "Bitte auswählen"-Leeroption überspringen

           var btn = document.createElement('button');
           btn.type = 'button';
           btn.title = opt.text;
           btn.setAttribute('aria-label', opt.text);

           if (window.CSS && CSS.supports && CSS.supports('color', farbe)) {
               btn.style.background = farbe;
           } else {
               // Kein gültiger Farbname/Hex-Code -> Text statt Fläche anzeigen
               btn.textContent = farbe;
           }
           if (opt.selected) btn.classList.add('aktiv');

           btn.addEventListener('click', function() {
               select.value = farbe;
               container.querySelectorAll('button.aktiv').forEach(function(b) {
                   b.classList.remove('aktiv');
               });
               btn.classList.add('aktiv');
           });
           container.appendChild(btn);
       });

       select.style.display = 'none';
       select.parentNode.insertBefore(container, select);
   })();
   </script>

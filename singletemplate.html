<style>
#map { width:100%; aspect-ratio: 16/10; border-radius: 8px; }
.geo-card { max-width:1100px; margin: 8px auto; background:#fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.12); overflow:hidden; }
/* Farbakzent aus dem Menue-Feld "CSS-Farbe" (ungültiger Wert = Deklaration wird ignoriert) */
.geo-hero { padding: 16px 24px 12px; background: #f4f6fa; border-left: 10px solid [[CSS-Farbe]]; }
.geo-hero-menue { float: right; margin-left: 12px; }
.geo-hero h3 { margin: 0 0 6px; font-size: xx-large; }
.geo-meta { font-size: 1.05em; }
.geo-meta img { border-radius: 50%; }
/* Lineare, klar getrennte Abschnitte */
.geo-abschnitt { padding: 18px 24px; border-top: 2px solid #e8ebf0; }
.geo-label { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 10px; padding-left: 10px; border-left: 4px solid #0f6cbf; }
.geo-text { line-height: 1.6; }
.geo-fotobox img { max-width: 100%; width: auto; max-height: 480px; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,0.18); }
/* Pulsierender Halo am Marker */
.geo-pingwrap { background: transparent !important; border: none !important; }
.geo-ping { display:block; width:100%; height:100%; border-radius:50%; opacity:0.55; animation: geoPulse 2s ease-out infinite; }
@keyframes geoPulse { 0% { transform: scale(0.3); opacity:0.7; } 100% { transform: scale(1.5); opacity:0; } }
</style>

<a href="#" id="geoZurueck" class="btn btn-link geo-zurueck d-print-none">&larr; Zurück zur Kartenübersicht</a>

<div class="geo-card">
    <div class="geo-hero">
        <div class="geo-hero-menue d-print-none">##actionsmenu##</div>
        <h3 id="geoTitel">[[Beschreibung]]</h3>
        <div class="geo-meta">##userpicture## ##user##</div>
    </div>

    <div class="geo-abschnitt" id="geoAbschnittText">
        <div class="geo-label">Beschreibung</div>
        <div class="geo-text" id="geoText">[[Textfeld]]</div>
    </div>

    <div class="geo-abschnitt" id="geoAbschnittFoto">
        <div class="geo-label">Foto</div>
        <div class="geo-fotobox" id="geoFoto">[[Foto]]</div>
    </div>

    <div class="geo-abschnitt">
        <div class="geo-label">Karte</div>
        <div id="map" style="background-color:#f5f5f5;"><span id="hinweis"><h4>Hinweis</h4>
        Diese Anwendung lädt Kartenmaterial von <a href="https://www.fossgis.de/datenschutzerkl%C3%A4rung/">OpenStreetMap</a>, <a href="https://opentopomap.org">OpenTopoMap</a>, <a href="https://memomaps.de/">memomaps.de</a>, <a href="https://arcgisonline.com">arcgisonline.com</a><br><br><input type="button" value="Ja, das ist in Ordnung" id="btn1" class="btn-primary"></span></div>
    </div>
</div>

<!-- Popup-Inhalt im HTML-Kontext: Nutzerdaten und Aktionsmenue koennen hier den JS-Code nicht zerstoeren -->
<div style="display:none">
    <div class="popupinhalt" data-farbe="[[CSS-Farbe]]">
        <span>##userpicture## ##user##</span><hr>[[Beschreibung]]
    </div>
</div>

<script>
    // Koordinate robust parsen: Bei ungueltigem Wert Karte statt Absturz auf Deutschland zentrieren
    var koordTeile = String('[[Koordinate]]').split(',').map(parseFloat);
    var center = (koordTeile.length === 2 && isFinite(koordTeile[0]) && isFinite(koordTeile[1]))
        ? [koordTeile[0], koordTeile[1]]
        : [48.5, 9];
    var zoom = 15; // Naeher am Eintrag: Umgebung gut erkennbar

    // Leere Abschnitte komplett ausblenden: kein Text -> kein Beschreibungs-Abschnitt,
    // kein Bild -> kein Foto-Abschnitt.
    (function() {
        var text = document.getElementById('geoText');
        var hatText = text && text.textContent.trim() !== '';
        if (!hatText) document.getElementById('geoAbschnittText').style.display = 'none';

        var foto = document.getElementById('geoFoto');
        var hatFoto = foto && foto.querySelector('img');
        if (!hatFoto) document.getElementById('geoAbschnittFoto').style.display = 'none';

        // Fallback-Titel, falls die Beschreibung leer ist
        var titel = document.getElementById('geoTitel');
        if (titel && !titel.textContent.trim()) titel.textContent = 'Eintrag';
        // Zurueck-Link ohne Inline-Handler
        var zurueck = document.getElementById('geoZurueck');
        if (zurueck) {
            zurueck.addEventListener('click', function(ev) {
                ev.preventDefault();
                history.back();
            });
        }
    })();
</script>

<script>
window.addEventListener("load", function()
{
    var schaltflaeche1 = document.getElementById("btn1");
    schaltflaeche1.addEventListener("click", function()
    {
        if (window.geoMap) return; // Karte nur einmal erzeugen
        sessionStorage.setItem("mapalert", "ok");
        document.getElementById("hinweis").style.display = "none";
        var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });
        var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.fossgis.de/datenschutzerkl%C3%A4rung/">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        });
        var WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });
        var OPNV = L.tileLayer('https://tileserver.memomaps.de/tilegen/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: 'Map <a href="https://memomaps.de/">memomaps.de</a> <a href="http://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>, map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        var map = L.map('map', {
            center: center,
            zoom: zoom,
            layers: [osm],
            scrollWheelZoom: true
        });

        L.control.layers({
            "OpenStreetMap": osm,
            "Topographisch": topo,
            "Luftbild": WorldImagery,
            "ÖPNV": OPNV
        }).addTo(map);
        window.geoMap = map;

        // Farbe aus dem versteckten Div lesen (kein Token im JS-Code)
        var inhalt = document.querySelector('.popupinhalt');
        var farbe = (inhalt && inhalt.getAttribute('data-farbe')) || 'green';

        // SVG-Pin dynamisch in der Farbe des Eintrags bauen
        var svg = '<svg viewBox="0 0 1400 1700" xmlns="http://www.w3.org/2000/svg" width="25" height="41"><g fill-rule="evenodd"><path d="m730.94 1839.6c-38.766-190.3-107.12-348.67-189.9-495.44-61.407-108.87-132.54-209.36-198.36-314.94-21.972-35.243-40.934-72.476-62.047-109.05-42.216-73.137-76.444-157.94-74.269-267.93 2.125-107.47 33.208-193.68 78.03-264.17 73.719-115.94 197.2-210.99 362.88-235.97 135.47-20.424 262.48 14.082 352.54 66.748 73.596 43.038 130.6 100.53 173.92 168.28 45.22 70.716 76.36 154.26 78.97 263.23 1.3401 55.83-7.7999 107.53-20.68 150.42-13.03 43.409-33.99 79.695-52.64 118.45-36.41 75.659-82.05 144.98-127.86 214.34-136.44 206.61-264.5 417.31-320.58 706.03z" fill="' + farbe + '" stroke-miterlimit="10" stroke-width="37"/><circle cx="729.55" cy="651.05" r="183.33" fill="#fff"/></g></svg>';
        var icon = L.icon({
            iconUrl: 'data:image/svg+xml,' + encodeURIComponent(svg),
            shadowUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACkAAAApCAQAAAACach9AAACMUlEQVR4Ae3ShY7jQBAE0Aoz/f9/HTMzhg1zrdKUrJbdx+Kd2nD8VNudfsL/Th///dyQN2TH6f3y/BGpC379rV+S+qqetBOxImNQXL8JCAr2V4iMQXHGNJxeCfZXhSRBcQMfvkOWUdtfzlLgAENmZDcmo2TVmt8OSM2eXxBp3DjHSMFutqS7SbmemzBiR+xpKCNUIRkdkkYxhAkyGoBvyQFEJEefwSmmvBfJuJ6aKqKWnAkvGZOaZXTUgFqYULWNSHUckZuR1HIIimUExutRxwzOLROIG4vKmCKQt364mIlhSyzAf1m9lHZHJZrlAOMMztRRiKimp/rpdJDc9Awry5xTZCte7FHtuS8wJgeYGrex28xNTd086Dik7vUMscQOa8y4DoGtCCSkAKlNwpgNtphjrC6MIHUkR6YWxxs6Sc5xqn222mmCRFzIt8lEdKx+ikCtg91qS2WpwVfBelJCiQJwvzixfI9cxZQWgiSJelKnwBElKYtDOb2MFbhmUigbReQBV0Cg4+qMXSxXSyGUn4UbF8l+7qdSGnTC0XLCmahIgUHLhLOhpVCtw4CzYXvLQWQbJNmxoCsOKAxSgBJno75avolkRw8iIAFcsdc02e9iyCd8tHwmeSSoKTowIgvscSGZUOA7PuCN5b2BX9mQM7S0wYhMNU74zgsPBj3HU7wguAfnxxjFQGBE6pwN+GjME9zHY7zGp8wVxMShYX9NXvEWD3HbwJf4giO4CFIQxXScH1/TM+04kkBiAAAAAElFTkSuQmCC',
            iconSize: [30, 50],
            shadowSize: [50, 50],
            iconAnchor: [15, 50],
            shadowAnchor: [15, 50],
            popupAnchor: [-3, -47]
        });

        if (koordTeile.length === 2 && isFinite(koordTeile[0]) && isFinite(koordTeile[1])) {
            // Pulsierender Halo um den Pin
            L.marker([koordTeile[0], koordTeile[1]], {
                icon: L.divIcon({
                    className: 'geo-pingwrap',
                    iconSize: [46, 46],
                    html: '<span class="geo-ping" style="background:' + farbe + '"></span>'
                }),
                interactive: false
            }).addTo(map);

            var marker = L.marker([koordTeile[0], koordTeile[1]], {icon: icon}).addTo(map);
            // Popup-Inhalt als DOM-Element, automatisch geoeffnet
            marker.bindPopup(inhalt);
            marker.openPopup();
        }
    }, false);
});

// Nach bestaetigter Datenschutzhinweis-Einwilligung Karte automatisch laden
window.addEventListener("load", function() {
    if (sessionStorage.getItem('mapalert')) {
        document.getElementById("hinweis").style.display = "none";
        window.setTimeout(function() { document.getElementById("btn1").click(); }, 300);
    }
});
</script>

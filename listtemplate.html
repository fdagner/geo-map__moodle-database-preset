<!-- Popup-Inhalt pro Eintrag. WICHTIG: Diese Vorlage darf KEIN JavaScript enthalten,
     weil hier Nutzerdaten per Token eingesetzt werden (Namen, Beschreibung, Aktionsmenue)
     und der Aktionsmenu-HTML mehrzeilig ist. Die Marker-Erzeugung geschieht in
     listtemplatefooter.html (createMarkers) ueber die data-Attribute. -->
<div style="display:none">
    <div class="popupinhalt" data-latlng="[[Koordinate]]" data-farbe="[[CSS-Farbe]]">
        <span>##userpicture## ##user##</span>
        <hr>[[Beschreibung]]<hr>##actionsmenu##
    </div>
</div>
